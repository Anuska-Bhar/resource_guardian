name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: guardian_app
          POSTGRES_PASSWORD: changeme
          POSTGRES_DB: resource_guardian
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5

      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify PostgreSQL Schema Migration
        env:
          PGPASSWORD: changeme
        run: |
          psql -h localhost -U guardian_app -d resource_guardian -f src/db/schema.sql

      - name: Build project
        run: npm run build

      - name: Run Test Suite (with Postgres & Redis integration)
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: guardian_app
          PGPASSWORD: changeme
          PGDATABASE: resource_guardian
          REDIS_HOST: localhost
          REDIS_PORT: 6379
        run: npm test